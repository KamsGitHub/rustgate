[workspace]
resolver = "3"
members = ["crates/rustgate", "crates/demo-service"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1"
arc-swap = "1.9"
axum = "0.8"
bytes = "1"
clap = { version = "4.6", features = ["derive", "env"] }
http = "1"
http-body-util = "0.1.5"
hyper = { version = "1.11", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "server-auto", "client-legacy", "http1", "http2", "server-graceful"] }
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1.3"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.26", features = ["v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
